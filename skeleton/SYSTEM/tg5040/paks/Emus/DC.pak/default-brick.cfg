minarch_cpu_speed = Performance
minarch_sync_reference = Emulated
minarch_rewind_enable = Off
# Left stick only as the stick: the core reads it as analog, so it must not
# also press the D-pad (issue #211)
minarch_stick_dpad = off
# Dreamcast face buttons by position (bottom = DC A) under either Button layout
minarch_face_buttons = positional
reicast_per_content_vmus = VMU A1
reicast_internal_resolution = 640x480
reicast_threaded_rendering = enabled
reicast_alpha_sorting = per-strip (fast, least accurate)
reicast_delay_frame_swapping = enabled
reicast_auto_skip_frame = more
reicast_enable_dsp = disabled
reicast_anisotropic_filtering = off
reicast_widescreen_hack = disabled
