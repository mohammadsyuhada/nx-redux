minarch_cpu_speed = Performance
# Native = pace at the core's 59.94 fps. Measured 2026-09-30 (FIFA Street 2, same
# save state, Brick): Native 100.1%, Auto 100.5% (but Auto follows the panel,
# 5% fast on the Smart Pro S's 62.948 Hz), Emulated 92.7% (its per-run slot
# scheduling costs PPSSPP, which always runs one vblank per retro_run)
minarch_sync_reference = Native
minarch_rewind_enable = Off
# PSP face buttons by position (bottom = PSP Cross) under either Button layout
minarch_face_buttons = positional
ppsspp_internal_resolution = 480x272
# Frameskip off: PPSSPP's auto frameskip also skips when a game keeps up
# (FIFA Street 2 on the Brick dropped from 30 to 15 fps shown); heavy 3D games
# on the Brick get full speed with Frameskip 1 set per game (Tekken 6: 72%
# without, ~99% at 30 fps with it)
ppsspp_auto_frameskip = disabled
ppsspp_frameskip = disabled
