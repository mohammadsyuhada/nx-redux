minarch_cpu_speed = Performance
minarch_sync_reference = Emulated
minarch_rewind_enable = Off
# Dreamcast face buttons by position (bottom = DC A) under either Button layout
minarch_face_buttons = positional

# Emulation threads on the big cores (cpu4-5), helpers and mali on cpu0-1, as in DC.pak
minarch_cpu_affinity = big

reicast_per_content_vmus = VMU A1
reicast_internal_resolution = 640x480
reicast_threaded_rendering = enabled
reicast_synchronous_rendering = disabled
reicast_framerate = fullspeed
reicast_alpha_sorting = per-strip (fast, least accurate)
reicast_delay_frame_swapping = disabled
reicast_enable_dsp = disabled
reicast_div_matching = auto
reicast_gdrom_fast_loading = enabled
reicast_enable_purupuru = enabled
reicast_anisotropic_filtering = 2
# Off on the 16:9 screen too: this core reports 16:9 whenever the hack is on but
# only widens games that don't clip, so 4:3 games (Metal Slug 6) were stretched.
# Players can turn it on per game for 3D games that support it.
reicast_widescreen_hack = disabled
reicast_region = Default
reicast_language = Default
