-supafaust_pixel_format = rgb565
# Affinity masks must stay within the CPUs MinUI.pak/launch.sh keeps online on
# tg5050 ({0,1,4} — cpu2/3/5/6/7 are hotplugged OFF). A mask with no online CPU
# makes pthread_setaffinity_np() fail and supafaust throws, killing minarch on
# game load (the 0xc = cpu2|cpu3 mask copied from tg5040 did exactly that).
# emu -> cpu4 (the big core), ppu render -> cpu0|cpu1.
-supafaust_thread_affinity_emu = 0x10
-supafaust_thread_affinity_ppu = 0x3
minarch_screen_scaling = Aspect
minarch_overlay = Aspect.png

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind Y Button = Y
bind X Button = X
bind B Button = B
bind A Button = A
bind L Button = L1
bind R Button = R1
