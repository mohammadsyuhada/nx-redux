minarch_cpu_speed = Performance
minarch_sync_reference = Native
minarch_rewind_enable = Off
minarch_cpu_affinity = big
mupen64plus-rdp-plugin = gliden64
mupen64plus-rsp-plugin = hle
mupen64plus-cpucore = dynamic_recompiler
mupen64plus-43screensize = 640x480
mupen64plus-aspect = 4:3
mupen64plus-EnableNativeResFactor = 2
mupen64plus-ThreadedRenderer = True
mupen64plus-EnableFBEmulation = True
mupen64plus-EnableCopyColorToRDRAM = Async
mupen64plus-EnableCopyDepthToRDRAM = Software
mupen64plus-BilinearMode = standard
mupen64plus-EnableLegacyBlending = False
mupen64plus-EnableFragmentDepthWrite = True
# 2D elements (HUDs, menus, hi-res packs): close the black lines where tiles
# meet (MK64 Reloaded's advice) and draw them at native resolution, as the
# standalone did
mupen64plus-CorrectTexrectCoords = Auto
mupen64plus-EnableNativeResTexrects = Optimized
# Hi-res texture packs: off by default (memory on 1 GB devices; see the docs).
# Turned on in Emulator Options, they load as the standalone loaded them:
# streamed from the .hts cache file (reuses caches the standalone built),
# full alpha, backgrounds too, at most 200 MB in memory.
mupen64plus-txHiresEnable = False
mupen64plus-EnableEnhancedHighResStorage = True
mupen64plus-txHiresFullAlphaChannel = True
mupen64plus-txFilterIgnoreBG = False
mupen64plus-MaxHiResTxVramLimit = 200
# Buttons as the standalone N64.pak had them: N64 A/B on the device's A/B,
# C-Down/C-Left on Y/X, all four C buttons on the right stick, Z on L2.
# "bind <name> = <device button>:<RetroPad button>"; the RetroPad side is what
# the core reads in its independent C-buttons mode (alt-map): A = RetroPad B,
# B = Y, C-Down = A, C-Left = L, C-Right = R, C-Up = X, Z = L2, R = R2,
# L = Select.
mupen64plus-alt-map = True
bind A Button = A:B
bind B Button = B:Y
bind C-Down = Y:A
bind C-Left = X:L1
bind C-Right = NONE:R1
bind C-Up = NONE:X
bind Z Trigger = L2:L2
bind R Shoulder = R1:R2
bind L Shoulder = L1:SELECT
bind Start = START
bind D-Pad Up = UP
bind D-Pad Down = DOWN
bind D-Pad Left = LEFT
bind D-Pad Right = RIGHT
