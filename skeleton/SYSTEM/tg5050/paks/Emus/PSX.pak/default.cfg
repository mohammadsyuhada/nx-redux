-swanstation_Display_ShowOSDMessages = false
-swanstation_Logging_LogLevel = Warning
minarch_rewind_buffer_mb = 128
minarch_rewind_granularity = 33
minarch_rewind_compression_speed = 12
minarch_rewind_compression = On

# CPU at Performance (both clusters at their top), as DC/N64/PSP: Auto's schedutil on the big
# core ramps too late for a frame-paced core (mGBA on cpu4 2026-10-11: 49% of frames late on Auto).
minarch_cpu_speed = Performance
# Emulation on the big cores, helpers and mali on cpu0-1 (as PS.pak).
minarch_cpu_affinity = big

# Hardware (GLES) renderer at native resolution: 2x leaves seams in 2D sprite art
# (Marvel Super Heroes); 3D games can raise it per game in the emulator options
swanstation_GPU_Renderer = OpenGL
swanstation_GPU_ResolutionScale = 1

minarch_gamepad_type = 1
bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind Circle = A
bind Cross = B
bind Triangle = X
bind Square = Y
bind L1 Button = L1
bind R1 Button = R1
bind L2 Button = L2
bind R2 Button = R2
